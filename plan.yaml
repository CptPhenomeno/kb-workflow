spec: SPEC.md
status: todo
items:
  - ref: retrieval-modes
    type: epic
    title: Dual-mode /kb-dev work retrieval (v0.1.1)
    description: |
      /kb-dev today picks the first open story by board position and works it
      to exhaustion; the user cannot steer a run and the top-level selection
      ignores the board DAG. SPEC.md v0.1.1 replaces only the retrieval step
      with two modes: bare invocation takes the first available task/bug from
      the whole board via `kb next` (one element per invocation, pending
      review items first); `/kb-dev <message>` passes the message as a kickoff
      to the main pi agent, which identifies the pertinent items (asking the
      user when ambiguous) and works them in DAG order through the unchanged
      v0.1.0 per-task pipeline.
      Done when all acceptance criteria AC-11..AC-16 of SPEC.md v0.1.1 are met.
    priority: high
    blocks: [git-workflow, thinking-config]
    acceptance:
      - AC-11 bare /kb-dev works exactly one element per the kb DAG and stops
      - AC-12 bare /kb-dev with nothing available notifies the user, no side effects
      - AC-13 pending review items are completed before new retrieval in bare mode
      - AC-14 message mode delivers the kickoff and works items in DAG order
      - AC-15 ambiguous messages trigger ask_user before any board/git change
      - AC-16 tests cover both retrieval paths and the kickoff template
    children:
      - ref: dev-retrieval-story
        type: story
        title: /kb-dev retrieves work via kb next (bare) or user kickoff (message)
        description: |
          The retrieval step of /kb-dev must respect the board DAG and be
          steerable by the user, while the per-task machinery (pre-flight,
          branch per task, dev/review rounds, merge chain, kb-qa) of v0.1.0
          stays untouched and is shared by both modes.
          This story implements FR-9 and FR-10: the handler parses the command
          arguments, and either resolves one element with `kb next` at board
          level (bare mode) or hands the message to the main pi agent via
          `pi.sendUserMessage` with a fixed kickoff template (message mode).
          Done when both retrieval modes drive the standard pipeline as
          specified in FR-9 and FR-10.
        priority: high
        children:
          - ref: dev-bare-mode
            type: task
            title: Bare invocation works one board-level element from kb next
            description: |
              Selection today ignores the board DAG at the top level and
              drains whole stories; a later, higher-priority unblocked task
              never gets picked first.
              The no-argument handler, after the FR-1 pre-flight, first
              completes the review of items already in the review column,
              then resolves the next element with `kb next` (no --parent
              filter) and works exactly that one element through its full
              FR-2/FR-4 cycle, then stops. If `kb next` exits 2, the user is
              notified and nothing else happens. The handler adds no own
              ordering (NFR-7).
              Done when AC-11, AC-12 and AC-13 hold.
            priority: high
            points: 3
            tests:
              - bare invocation reviews pending review items before retrieving
              - bare invocation takes the first kb-next element regardless of story
              - bare invocation completes one element then stops
              - bare invocation with nothing available notifies the user without side effects
            blocks: [dev-retrieval-tests]
          - ref: dev-message-mode
            type: task
            title: Message invocation delivers a kickoff to the main agent
            description: |
              The user has no way to steer a /kb-dev run toward specific
              items; the handler cannot interpret free-form requests.
              After the FR-1 pre-flight, `/kb-dev <message>` first
              completes the review of any items already sitting in the
              `review` column — exactly the same deterministic board-wide
              rounds as FR-9 step 1 (one kb-reviewer round per item, FR-4
              merge chain) — and only then passes the
              message to the main pi agent via `pi.sendUserMessage` using a
              fixed kickoff template instructing the agent to: interpret the
              message as operational instructions, identify the pertinent kb
              items (by ID/ref or by matching titles/descriptions/test
              states; generic requests must work), ask the user with
              `ask_user` when the message is ambiguous or maps to no item
              before any board or git change (NFR-8), and work the identified
              items in DAG order through the standard pipeline. The handler
              itself performs no board or git action beyond the pre-flight
              and the pending-review rounds of step FR-10.2 (item selection
              and orchestration belong to the main agent).
              Done when AC-14 and AC-15 hold.
            priority: medium
            points: 3
            tests:
              - message mode runs the pre-flight before delivering the kickoff
              - message mode completes pending reviews before the kickoff
              - kickoff template covers interpretation, identification, ask-first and DAG order
              - ambiguous message triggers ask_user before any board or git change
            blocks: [dev-retrieval-tests]
          - ref: dev-retrieval-tests
            type: task
            title: Extension tests cover both retrieval paths
            description: |
              AC-16 requires test coverage of the new retrieval logic so
              regressions in argument parsing, bare-mode selection or the
              kickoff template are caught.
              The extension test suite gains tests for argument parsing
              (bare vs message), the bare-mode single-element selection via
              `kb next` (including review-first and nothing-available), and
              the content of the kickoff template (operational
              interpretation, item identification, ask-first rule, DAG
              order).
              Done when AC-16 holds and all new tests pass.
            priority: medium
            points: 3
            tests:
              - argument parsing distinguishes bare and message invocations
              - bare-mode selection is delegated to kb next, one element per invocation
              - kickoff template contains interpretation, identification, ask-first and DAG-order rules
