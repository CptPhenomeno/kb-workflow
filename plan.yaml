spec: SPEC.md
status: todo
items:
  # ---------------------------------------------------------------- v0.1.2 epic
  - ref: story-retrieval-v012
    type: epic
    title: Story-level bare retrieval and kb-qa review routing (v0.1.2)
    description: |
      v0.1.1 made the bare mode work one task per invocation; in practice
      the story is the unit of work — a story's tasks build on each other
      and only make sense together. SPEC.md v0.1.2 (FR-11) returns the
      bare `/kb-dev` invocation to story granularity: the story is
      selected by the kb DAG via `kb next --type story`, all its tasks are
      worked through their full branch/develop/review/merge cycles, then
      the kb-qa story review runs (and the epic review if triggered) and
      the invocation stops. The sweep routing and kb-qa trigger changes
      (FR-12/FR-13/FR-14) are folded into KB-23 and depend on KB-22.
      Done when AC-17 holds and the story-level retrieval is covered by
      tests (AC-21).
    priority: high
    acceptance:
      - AC-17 bare /kb-dev takes the first story per kb next --type story, works all its tasks, runs the kb-qa reviews and stops
      - AC-21 story-level bare retrieval is covered by tests (kb next --type story, one story per invocation)
    children:
      - ref: bare-story-retrieval
        type: story
        title: Bare /kb-dev works one unit per invocation via the epic → story → task chain
        description: |
          The bare invocation must take the story as the unit of work
          instead of a single task, selected by the kb DAG rather than by
          board position.
          This story reworks the already-implemented task-level bare mode
          (lib/bare-mode.ts, lib/dispatch.ts, index.ts) per FR-11: after
          the FR-1 pre-flight and the FR-12 sweep, the handler resolves
          the unit via the epic-scoped fallback chain — `kb next --type
          epic` scopes the selection, the story is resolved with
          `kb next --type story --parent <epic>`, falling back to a
          board-wide `kb next --type story`, then to a single `kb next`
          task/bug (reopened items under done parents). One story per
          invocation (or one task/bug in the fallback), scoped by the
          first available epic: the handler works every task of the story
          in DAG order (`kb next --parent <story>`) through the full
          FR-2/FR-4 cycle, then runs the kb-qa story review (FR-13) and
          the epic review if triggered, and stops. Nothing available at
          any level notifies the user.
          Done when FR-11 (resolution chain and unit work) holds and
          AC-17 is met.
        priority: high
        children:
          - ref: bare-story-resolve
            type: task
            title: Bare invocation resolves the unit via the epic → story → task chain
            description: |
              Selection at task level (v0.1.1) drains single tasks and
              leaves stories half-finished; the story is the natural unit.
              The bare-mode handler resolves the unit of work with the
              FR-11 fallback chain, stopping at the first success:
              1. `kb next --type epic` — if an epic is available, it scopes
                 the selection: resolve the story with
                 `kb next --type story --parent <epic>`;
              2. if no epic is available (or the scoped query returns
                 nothing), resolve the story board-wide with
                 `kb next --type story` (covers stories reopened under a
                 done epic);
              3. if no story is available, resolve a single task or bug
                 with `kb next` (covers tasks/bugs reopened under a done
                 story);
              4. if nothing is available at any level, notify the user
                 and take no further action.
              The epic only scopes which story is taken: the unit of work
              is always one story (or, in the level-3 fallback, one
              task/bug). The handler adds no own ordering.
              Done when the bare invocation resolves the unit via the
              epic → story → task chain and notifies the user when
              nothing is available at any level.
            priority: high
            points: 3
            tests:
              - available epic scopes the story resolved via kb next --type story --parent <epic>
              - with no epic or empty scoped query, the story is resolved board-wide via kb next --type story
              - with no story available, a single task or bug is resolved via kb next
              - nothing available at any level notifies the user without side effects
            blocks: [bare-story-loop]
          - ref: bare-story-loop
            type: task
            title: Bare invocation works all story tasks through the full cycle then stops
            description: |
              A story's tasks build on each other; working only one per
              invocation leaves the story incoherent and the develop branch
              mid-feature.
              The bare-mode loop works the whole resolved story: for each
              of its tasks, in DAG order (`kb next --parent <story>` until
              exit 2), run the full existing cycle — FR-2 branch per task,
              kb-developer round with the existing retry policy, FR-4
              review with merge. When every task of the story is done and
              the story reaches `review`, the handler spawns the kb-qa
              story review (FR-13); if the parent epic reaches `review` in
              turn (all sibling stories done), the kb-qa epic review runs
              too. The invocation then stops — one story per invocation
              (the story branch of FR-11).
              Done when a bare invocation finishes a whole story (tasks
              cycled, story and, if triggered, epic reviewed) and stops.
            priority: high
            points: 5
            tests:
              - each story task runs the full branch/develop/review/merge cycle in DAG order
              - story reaching review after all tasks spawns the kb-qa story review
              - epic reaching review after all sibling stories spawns the kb-qa epic review
              - invocation stops after the story and any epic review
            blocks: [bare-story-tests]
          - ref: bare-story-tests
            type: task
            title: Extension tests cover story-level bare retrieval
            description: |
              AC-21 requires test coverage of the reworked bare mode so
              regressions in story selection or the story task loop are
              caught.
              The extension test suite gains tests for the story-level
              retrieval: `kb next --type story` drives the selection, one
              story is worked per invocation (its tasks in DAG order via
              `kb next --parent`), and nothing-available notifies the user.
              Done when the story-level bare retrieval is covered by
              passing tests.
            priority: medium
            points: 2
            tests:
              - FR-12 sweep completes pending reviews before the story loop; report covers the full story run
              - reviewer failure mid-story stops the story loop before the next task

  # ------------------------------------------------- updated existing items
  - ref: dev-handler-story-review          # KB-21
    type: story
    title: Automatic kb-qa review of stories and epics with branch cleanup
    description: |
      Nobody currently reviews story/epic items themselves. Per the
      uniform kb-qa trigger of SPEC.md v0.1.2 (FR-13, detailing FR-5/FR-6):
      whenever a story or epic sits in the `review` column — left by a
      previous run, reached by the bare story loop, or reached during
      message-driven work — a kb-qa round runs on it: validate the item's
      acceptance criteria (`kb show <ID> --json`) against the merged work
      on `develop`; on success verify every task branch (`feature/<id>`,
      `fix/<id>`) is merged into develop (tip is an ancestor of develop),
      delete them with `git branch -d`, check all criteria, add a note and
      move the item to `done`; on problems add a note and move it back to
      `todo`. kb-qa never merges branches — task-level integration stays
      with kb-reviewer (FR-4, NFR-10); only task branches are deleted,
      only with `-d` (FR-7).
      Done when AC-7 and AC-8 hold via kb-qa in all trigger paths.
    priority: medium
    acceptance:
      - AC-7 story kb-qa review with branch deletion on success
      - AC-8 epic kb-qa review when all stories are done; planner never spawned for review
    children:
      - ref: planner-agent-story-review      # KB-22
        type: task
        title: "kb-qa agent: system prompt and registration as fourth role"
        description: |
          FR-8/FR-5/FR-6/FR-7: a new agents/kb-qa.md system prompt
          (identify as agent-qa-<story/epic ID>, kb show <ID> --json,
          validate acceptance criteria against the merged work on
          develop, verify branch ancestry, delete task branches with
          git branch -d, move the item to done or back to todo with a
          note); the kb_agent tool's agent parameter accepts kb-qa
          alongside the other three roles; the model config gains a
          qa role (models.qa / resolveAgentModel("qa", ...)) with the
          same fallback-to-session-model rule. Only task branches are
          deleted, never with -D. kb-qa never merges branches.
          Done when kb-qa is a first-class agent usable via kb_agent.
        priority: medium
        points: 3
        acceptance:
          - no deleted branch tip is missing from develop
          - kb-qa registered with prompt, tool enum entry and qa config role
        tests:
          - unmet criteria send the story back to todo with a note
          - kb_agent tool accepts agent "kb-qa"
          - models.qa resolves with fallback to the session model
          - kb-qa deletes only merged task branches with -d
        blocks: [handler-auto-review]
      - ref: handler-auto-review            # KB-23
        type: task
        title: /kb-dev spawns kb-qa automatically at story and epic completion
        description: |
          The kb-qa trigger (FR-13) must fire identically whether the run
          is driven by the DAG or by a user message; today nothing routes
          stories/epics in review to kb-qa.
          Three changes in the /kb-dev handler, sharing code between both
          invocation modes. (1) The startup sweep (FR-12) routes items
          already sitting in the `review` column by type: tasks and
          subtasks to kb-reviewer rounds (FR-4 merge chain), stories and
          epics to kb-qa rounds (FR-13). (2) In bare mode, the handler
          spawns the kb-qa round when the story reaches `review` after all
          its tasks are done — and the kb-qa epic round when all sibling
          stories of the parent epic are done. (3) In message mode, the
          kickoff template (FR-14) instructs the main agent to spawn a
          kb-qa round for every story/epic that reaches `review` during
          the message-driven work. kb-qa never merges (FR-4 stays with
          kb-reviewer). Depends on KB-22 (kb-qa registration).
          Done when AC-18, AC-19 and AC-20 hold in both modes.
        priority: medium
        points: 3
        acceptance:
          - AC-7 and AC-8 hold end to end
        tests:
          - all-tasks-done triggers the story kb-qa review
          - all-stories-done triggers the epic kb-qa review
          - final report lists branches, merge outcomes, review verdicts and deletions
          - "sweep routes review items by type: tasks/subtasks to kb-reviewer, stories/epics to kb-qa"
          - bare-mode story completion triggers the kb-qa story review
          - kickoff template instructs the main agent to spawn kb-qa for stories/epics reaching review
        blocks: [workflow-tests, tests-git-fixture]

  - ref: tests-git-fixture                 # KB-25
    type: task
    title: Temp local git repo test fixture and workflow test suite
    description: |
      AC-10 required tests for the git workflow; most of that coverage
      already exists in lib/git.test.ts thanks to the temp-git-repo
      fixture: branch prefix choice by item type, branch reuse, the
      ff→no-ff→abort merge chain, dirty-tree pre-flight, isMerged
      ancestry and `-d` deletion are all covered.
      What remains is the "all-branches-merged verification gates
      deletion" test — the kb-qa behavior that refuses to delete a task
      branch whose tip is not an ancestor of develop (depends on KB-23)
      — plus an audit of AC-10 for any remaining gap, closing gaps found.
      Done when the remaining AC-10 areas are covered by passing tests
      and no test performs a remote operation.
    priority: medium
    points: 5
    acceptance:
      - AC-10 suite passes locally with git available
    tests:
      - all-branches-merged verification gates deletion

  # ---------------------------------------------------------------- v0.1.3 task
  - ref: config-location
    type: task
    title: kb-workflow.json is read from the extension folder, not the agents folder
    description: |
      The installed extension ships kb-workflow.json in its own folder
      (e.g. ~/.pi/agent/extensions/kb-workflow/kb-workflow.json), but
      loadKbWorkflowConfig looks for the global config in the agents
      folder via getAgentDir() — a file that does not exist. The shipped
      config is silently ignored and every role falls back to the
      session model.
      FR-15: read the global config from the extension's own folder,
      resolved module-relative at runtime (e.g. via import.meta.url);
      keep the project-local .pi/kb-workflow.json override; remove the
      getAgentDir() lookup entirely — no fallback. NFR-11: the loader
      must work identically from source and from the installed folder.
      Done when AC-22 holds.
    priority: high
    points: 2
    blocks: [thinking-config]
    acceptance:
      - AC-22 loader reads kb-workflow.json from the extension's own folder (module-relative); a config there takes effect; an agents-folder file is ignored; the project-local .pi override still wins per property
    tests:
      - loader reads the config from the extension folder (module-relative)
      - agents-folder config is ignored
      - project-local .pi override still wins per property

  # ---------------------------------------------------------------- v0.2.0 epic (redo)
  - ref: thinking-config                # KB-1
    type: epic
    title: Per-agent model and thinking-level configuration (v0.2.0)
    description: |
      kb-workflow subagents are configurable only by model today, and the
      thinking level of the dispatching session is forwarded only when the
      model is inherited — an explicit model silently drops it. SPEC v0.2.0
      (FR-16..FR-22) replaces the `models` object with a `kb-agents` shape
      carrying `model` and `thinking-level` per role (planner, developer,
      reviewer and the fourth role, qa), merges the extension-folder and
      project-local configs per single property, validates the thinking
      level, resolves both properties per role with independent fallback to
      the session, forwards `--model` and `--thinking` independently, and
      rewrites the docs and the shipped configs.
      This is a redo of the work first specced on 2026-11-11, on top of
      v0.1.3: the config is now read from the extension folder (FR-15), so
      the old `models` format is no longer read anywhere and the shipped
      configs must be rewritten in the same change (FR-22).
      Done when AC-23..AC-30 hold.
    priority: high
    acceptance:
      - AC-23 a kb-agents config resolves model and thinking-level per role and both reach the spawned pi process as --model / --thinking
      - AC-24 an old models-format config is ignored entirely; fallbacks apply
      - AC-25 extension-folder and project configs merge per property
      - AC-26 an unknown thinking-level is ignored and the session level is forwarded
      - AC-27 a role defining only model spawns with --model <configured> and --thinking <session level>
      - AC-28 a fully absent role inherits the session model and thinking level
      - AC-29 the qa role is resolved like the other three
      - AC-30 README, the index.ts header comment, kb-workflow.example.json and the repo's kb-workflow.json show the kb-agents format
    children:
      - ref: config-new-shape           # KB-2
        type: story
        title: kb-agents config shape with per-property merge, validation and per-role resolution
        description: |
          The old `models` object cannot express a thinking level per role,
          and the shipped config is now actually read (v0.1.3), so the shape
          must change for real rather than be layered on.
          This story reworks the pure config module and its loader around a
          `kb-agents` object where each of the four roles
          (planner/developer/reviewer/qa) is `{ "model": string,
          "thinking-level": string }`, both properties optional. The old
          `models` format is no longer supported: a file without a valid
          `kb-agents` object contributes nothing and is ignored silently.
          The extension-folder and project-local files merge deeply, per
          single property, and resolution returns model and thinking level
          per role with independent fallback to the dispatching session.
          Done when AC-23, AC-24, AC-25, AC-26, AC-27, AC-28 and AC-29 hold
          for the config layer.
        priority: high
        acceptance:
          - AC-23 a kb-agents config resolves model and thinking-level per role
          - AC-24 an old models-format config is ignored entirely; fallbacks apply
          - AC-25 extension-folder and project configs merge per property
          - AC-26 an unknown thinking-level is ignored and treated as unset
          - AC-29 the qa role is resolved like the other three
        children:
          - ref: config-kb-agents-shape   # KB-3
            type: task
            title: Parse and validate the kb-agents shape in the pure config module
            description: |
              The current parser only knows a flat `models` map, so a
              thinking level cannot be expressed per role and the qa role
              has no place for one.
              In the PURE `lib/config.ts` replace the `models` parsing with
              a `kb-agents` object: each of planner, developer, reviewer and
              qa maps to an object whose `model` and `thinking-level`
              properties are both optional. A file without a valid
              `kb-agents` object — including an old `models`-format file —
              contributes nothing (FR-17) and is never fatal (NFR-12).
              Validate `thinking-level` against the pi levels
              off|minimal|low|medium|high|xhigh|max; an unknown value is
              ignored (treated as unset) and never causes a hard failure
              (FR-19). The module stays pure: no filesystem, no pi-package
              imports except the `ThinkingLevel` type (NFR-13/NFR-14).
              The old-shape tests in `lib/config.test.ts` are replaced by
              tests for the new shape.
              Done when AC-23, AC-24 and AC-26 hold at the parse/validate
              level and the old-shape tests are gone.
            priority: high
            points: 3
            tests:
              - kb-agents config parses model and thinking-level for all four roles including qa
              - role object with only model or only thinking-level parses without error
              - old models-format config yields no kb-agents entries
              - unknown thinking-level is dropped and treated as unset
              - malformed or non-object config never throws
            blocks: [config-deep-merge]
            acceptance:
              - AC-23 the pure config module exposes model and thinking-level per role from a kb-agents file
              - AC-24 a file without a valid kb-agents object contributes nothing
              - AC-26 a thinking-level outside off|minimal|low|medium|high|xhigh|max is ignored, never fatal
          - ref: config-deep-merge       # KB-4
            type: task
            title: Deep per-property merge of the extension-folder and project configs
            description: |
              Roles must be configurable partly globally and partly
              project-locally, and the current loader shallow-merges whole
              role strings so one file always wins entirely.
              In `lib/config-load.ts` keep the FR-15 locations (extension
              folder global + project-local `.pi/kb-workflow.json`, later
              wins) but merge the two files deeply, per single property
              (FR-18): for each role, `model` and `thinking-level` are
              merged independently, in both directions — a role may take its
              model from one file and its thinking level from the other.
              A file in the old `models` format contributes nothing.
              Done when AC-25 holds.
            priority: high
            points: 2
            tests:
              - role takes model from the extension-folder config and thinking-level from the project config
              - role takes model from the project config and thinking-level from the extension-folder config
              - project property overrides the same property from the extension-folder config
              - an old models-format file contributes nothing to the merge
            blocks: [config-resolution]
            acceptance:
              - AC-25 a role defined in both files takes model from one and thinking-level from the other when each file defines only one
          - ref: config-resolution       # KB-5
            type: task
            title: resolveAgentConfig returns model and thinking level per role with independent fallback
            description: |
              Callers need both resolved values per role from one place, and
              the fallback must be per property: today an explicit model
              silently drops the session's thinking level.
              Provide `resolveAgentConfig` in `lib/config.ts` returning, for
              each role, the configured model and thinking level, each
              falling back independently to the dispatching session's value
              (FR-20): unset or invalid thinking level → the session's
              thinking level, always forwarded even when the model is
              explicit; unset model → the session's model. The qa role is
              resolved like the other three (AC-29). Keep the pure module
              free of filesystem and pi-runtime imports.
              Done when AC-27, AC-28 and AC-29 hold.
            priority: high
            points: 2
            tests:
              - role with only model resolves to that model and the session thinking level
              - role absent from the config resolves to the session model and thinking level
              - role with an unknown thinking-level resolves to the session thinking level
              - qa role resolves model and thinking-level like planner, developer and reviewer
            acceptance:
              - AC-27 a role defining only model resolves to the configured model plus the session thinking level
              - AC-28 a fully absent role resolves to the session model and thinking level
              - AC-29 the qa role is resolved like the other three

      - ref: subagent-dispatch          # KB-6
        type: story
        title: Subagent dispatch forwards model and thinking level independently
        description: |
          Today the thinking level is only forwarded when the model is
          inherited; an explicit model silently drops the session's thinking
          level. SPEC v0.2.0 (FR-21) requires `--model` and `--thinking` to
          be passed independently, with the session's thinking level always
          forwarded as fallback.
          This story changes `runSubagent` and the dispatch layer: the
          dispatchers now live in `lib/bare-mode.ts`, `lib/message-mode.ts`
          and `lib/dispatch.ts`, with their seams injected by `index.ts`, so
          both dispatch paths must call `resolveAgentConfig` and forward
          both properties per role.
          Done when AC-23, AC-27 and AC-28 hold end to end.
        priority: high
        acceptance:
          - AC-23 model and thinking-level resolved per role reach the spawned pi process as --model / --thinking
          - AC-27 a role defining only model spawns with --model <configured> and --thinking <session level>
          - AC-28 a fully absent role inherits the session model and thinking level
        children:
          - ref: subagent-run-flags       # KB-7
            type: task
            title: runSubagent passes --model and --thinking independently
            description: |
              `runSubagent` currently builds its args with
              `if (model) --model else if (thinkingLevel) --thinking`, so an
              explicit model always suppresses the session's thinking level.
              Change `lib/subagent.ts` so `--model` and `--thinking` are
              built independently of each other (FR-21): `--model` carries
              the model resolved for the role, `--thinking` the resolved
              thinking level (configured, or the dispatching session's level
              as fallback). Neither flag suppresses the other; a property
              that resolves to nothing is simply not passed.
              Done when AC-27 and AC-28 hold at the CLI-args level.
            priority: high
            points: 3
            tests:
              - role with explicit model receives both --model <configured> and --thinking <session level>
              - absent role inherits the session model and thinking level
              - configured thinking-level is passed as --thinking without a --model
            blocks: [index-dispatch]
            acceptance:
              - AC-27 a role defining only model spawns with --model <configured> and --thinking <session level>
              - AC-28 a fully absent role inherits the session model and thinking level
          - ref: index-dispatch           # KB-8
            type: task
            title: bare-mode, message-mode and dispatch forward both properties per role
            description: |
              Both dispatch paths must use the new per-role resolution, and
              the dispatchers no longer live in `index.ts`: they are
              `lib/bare-mode.ts`, `lib/message-mode.ts` and `lib/dispatch.ts`,
              with their seams (subagent runner, kb, config) injected by
              `index.ts`.
              Update the dispatchers so every subagent round — bare mode and
              message mode alike — calls `resolveAgentConfig` for the role
              and forwards both the model and the thinking level to
              `runSubagent`, each falling back independently to the
              dispatching session's value (FR-20/FR-21). The `index.ts`
              wiring supplies the session model and thinking level through
              the existing seams; the `kb_agent` tool goes through the same
              resolution. The `index.ts` header comment is updated to
              document the new `kb-agents` shape (FR-22).
              Done when AC-23 and AC-29 hold for both dispatch paths and the
              header comment shows the new format.
            priority: high
            points: 3
            tests:
              - bare-mode round resolves and forwards model and thinking-level per role
              - message-mode round resolves and forwards model and thinking-level per role
              - qa role round forwards its configured model and thinking-level
              - kb_agent tool forwards the resolved model and thinking level
            blocks: [docs-update]
            acceptance:
              - AC-23 both dispatch paths forward the resolved model and thinking-level per role
              - AC-29 the qa role is resolved like the other three
              - AC-30 the index.ts header comment documents the kb-agents format

      - ref: docs-update                # KB-9
        type: story
        title: Documentation and shipped configs rewritten in the kb-agents format
        description: |
          Users discover the config format from the README and the example
          files, and since v0.1.3 the shipped `kb-workflow.json` is actually
          read; after FR-17 an old-format file is silently ignored, so a
          docs-only change would silently disable every configured role.
          This story rewrites the "Model configuration" section of
          `README.md`, the `index.ts` header comment, `kb-workflow.example.json`
          and the repo's own `kb-workflow.json` in the `kb-agents` format
          with per-role `model` and `thinking-level` (FR-22).
          Done when AC-30 holds.
        priority: medium
        acceptance:
          - AC-30 README, the index.ts header comment, kb-workflow.example.json and the repo's kb-workflow.json show the kb-agents format
        children:
          - ref: docs-readme-examples    # KB-10
            type: task
            title: README, header comment and both config files show the kb-agents format
            description: |
              FR-22: documentation and the shipped configs must match the new
              format. This is load-bearing, not cosmetic: since v0.1.3 the
              config shipped in the extension folder IS read, and after
              FR-17 a file still in the old `models` format is silently
              ignored — every role would quietly fall back to the session
              model.
              Rewrite the "Model configuration" section of `README.md` to
              describe `kb-agents` with per-role `model` and
              `thinking-level` (the four roles including qa, the allowed
              thinking levels, the per-property merge, the independent
              fallback rules), rewrite the `index.ts` header comment, and
              convert `kb-workflow.example.json` and the repo's
              `kb-workflow.json` to the new format.
              Done when AC-30 holds and no shipped file uses `models`.
            priority: medium
            points: 2
            tests:
              - README Model configuration section documents kb-agents with model and thinking-level for all four roles
              - kb-workflow.example.json uses the kb-agents format
              - repo kb-workflow.json uses the kb-agents format
              - no shipped config file still uses the models key
            acceptance:
              - AC-30 README, the index.ts header comment, kb-workflow.example.json and the repo's kb-workflow.json document/show the new kb-agents format
